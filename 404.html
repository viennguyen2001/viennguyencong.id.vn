    <header class="site-topbar" id="site-topbar" data-site-toolbar>

      <div class="case-loading wrap" aria-hidden="true">
        <div class="case-loading__hero">

            <span class="case-loading__bar case-loading__bar--lead"></span>
          </div>
          <span class="case-loading__panel"></span>
        </div>
        <span class="case-loading__cover"></span>
      </div>
      <p class="sr-only" role="status">Loading the case study…</p>
      <noscript><p class="case-noscript wrap">This case study needs JavaScript. You can still <a href="/projects/">browse all projects</a>.</p></noscript>

    <footer class="footer wrap">
      <p class="footer__big">Let’s make<br />something clear.</p>
      <a class="footer__email" href="mailto:viennguyencong.id.vn@gmail.com">viennguyencong.id.vn@gmail.com</a>
